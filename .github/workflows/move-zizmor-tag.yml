name: Move the zizmor-v1, security-v1 and deps-v1 tags

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: move-zizmor-tag
  cancel-in-progress: true

jobs:
  retag:
    name: Move the tags to the tip of develop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point the tags at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for tag in zizmor-v1 security-v1 deps-v1; do
            if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${REPO}/git/refs/tags/${tag}" \
                -f sha="${SHA}" -F force=true --jq '.object.sha'
              echo "moved ${tag} to ${SHA}"
            else
              gh api -X POST "repos/${REPO}/git/refs" \
                -f ref="refs/tags/${tag}" -f sha="${SHA}" --jq '.object.sha'
              echo "created ${tag} at ${SHA}"
            fi
          done
